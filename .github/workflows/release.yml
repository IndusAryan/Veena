name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify tag matches versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          GRADLE_FILE=$(ls app/build.gradle.kts app/build.gradle 2>/dev/null | head -1)
          GRADLE_VERSION=$(grep -E 'versionName' "$GRADLE_FILE" | head -1 | sed -E "s/.*[\"']([^\"']+)[\"'].*/\1/")
          echo "Tag version:    $TAG_VERSION"
          echo "Gradle version: $GRADLE_VERSION"
          if [ -z "$GRADLE_VERSION" ]; then
            echo "Could not read versionName from $GRADLE_FILE"; exit 1
          fi
          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "Tag ($TAG_VERSION) does not match versionName ($GRADLE_VERSION)"; exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Remove NDK to match F-Droid build environment
        run: |
          rm -rf "$ANDROID_HOME/ndk"
          rm -rf "$ANDROID_SDK_ROOT/ndk" 2>/dev/null || true

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEY_B64 }}" | base64 --decode > ${{ github.workspace }}/keystore.jks

      - name: Build with Gradle
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify APK is signed
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "Signed APK not found at expected path: $APK"
            echo "Files actually produced:"
            ls -la app/build/outputs/apk/release/ || true
            echo "If you see app-release-unsigned.apk, the signingConfig in Gradle is not wired up."
            exit 1
          fi
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs "$APK"

      - name: Remove keystore
        if: always()
        run: rm -f "${{ github.workspace }}/keystore.jks"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true